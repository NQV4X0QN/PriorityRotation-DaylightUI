  <!-- the key press at the centre -->
  <circle cx="200" cy="200" r="44" fill="url(#dawn)"/>
  <circle cx="200" cy="200" r="29" fill="#0c0c10"/>
  <circle cx="200" cy="200" r="14" fill="#f4efe6"/>
