<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Vivid DaylightUI plugin sunset gradient: bright gold -> hot magenta -> electric violet -->
    <linearGradient id="sunset" gradientUnits="userSpaceOnUse" x1="200" y1="88" x2="200" y2="308">
      <stop offset="0%" stop-color="#ffbc1a"/>
      <stop offset="50%" stop-color="#ff1e7a"/>
      <stop offset="100%" stop-color="#7038ff"/>
    </linearGradient>

    <mask id="swords-mask">
      <rect x="0" y="0" width="400" height="400" fill="black"/>
      <!-- Back sword (-43 deg) -->
      <g transform="translate(200,206) rotate(-43)">
        <path d="M 0 -158 L 20 -114 L 17 24 L -17 24 L -20 -114 Z" fill="white"/>
        <path d="M 0 -118 L 4 -102 L 3 12 L -3 12 L -4 -102 Z" fill="black"/>
        <path d="M -46 30 L -15 35 L 15 35 L 46 30 L 40 48 L 10 50 L 9 104 L 19 117 L 0 134 L -19 117 L -9 104 L -10 50 L -40 48 Z" fill="white"/>
      </g>
      <!-- Front sword (+43 deg) knocks out cleanly across the back blade -->
      <g transform="translate(200,206) rotate(43)">
        <path d="M 0 -158 L 20 -114 L 17 24 L -17 24 L -20 -114 Z" fill="black" stroke="black" stroke-width="18" stroke-linejoin="round"/>
        <path d="M -46 30 L -15 35 L 15 35 L 46 30 L 40 48 L 10 50 L 9 104 L 19 117 L 0 134 L -19 117 L -9 104 L -10 50 L -40 48 Z" fill="black" stroke="black" stroke-width="18" stroke-linejoin="round"/>
        <path d="M 0 -158 L 20 -114 L 17 24 L -17 24 L -20 -114 Z" fill="white"/>
        <path d="M 0 -118 L 4 -102 L 3 12 L -3 12 L -4 -102 Z" fill="black"/>
        <path d="M -46 30 L -15 35 L 15 35 L 46 30 L 40 48 L 10 50 L 9 104 L 19 117 L 0 134 L -19 117 L -9 104 L -10 50 L -40 48 Z" fill="white"/>
      </g>
    </mask>
  </defs>

  <!-- Full-bleed dark tile -->
  <rect x="0" y="0" width="400" height="400" fill="#131316"/>

  <!-- Electric-blue rotation arrows -->
  <g>
    <path d="M 150.4 86.5 A 122 122 0 0 1 223.3 78.2" fill="none" stroke="#0a94ff" stroke-width="15" stroke-linecap="round"/>
    <polygon points="257.3,90.3 224.5,59.1 217.9,96.6" fill="#0a94ff"/>
    <path d="M 249.6 309.5 A 122 122 0 0 1 176.7 317.8" fill="none" stroke="#0a94ff" stroke-width="15" stroke-linecap="round"/>
    <polygon points="142.7,305.7 175.5,336.9 182.1,299.4" fill="#0a94ff"/>
  </g>

  <!-- Crossed swords filled with the sunset gradient -->
  <rect x="0" y="0" width="400" height="400" fill="url(#sunset)" mask="url(#swords-mask)"/>
</svg>
